# The full-history half of the secret scan. The PR-scoped scan in ci.yml's
# `lint` job only ever walks a PR's own commits — see that file's header and
# tools/secret-scan/README.md — so this is the only thing that walks every
# commit ever pushed to `main`, catching a secret that reached the repository
# before this scan existed.
#
#   https://github.com/CalixtoTheBugHunter/talos/wiki/Safeguards-and-Autonomy#what-is-never-allowlistable
#   https://github.com/CalixtoTheBugHunter/talos/issues/29
#
# Not a required status check: a schedule-triggered run has no pull request to
# gate, and per decision 64 no new required-status-check context is added for
# this scan regardless of trigger —
# https://github.com/CalixtoTheBugHunter/talos/wiki/Decision-Log#engineering-decisions.
# A finding here fails the run, which shows as a red run on the Actions tab and
# notifies whoever watches this repository; see SECURITY.md for what happens
# next.

name: secret-scan-scheduled

on:
  schedule:
    - cron: '0 6 * * 1' # every Monday, 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5

jobs:
  secret-scan-full-history:
    name: secret-scan-full-history
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Cache the pinned gitleaks binary
        id: gitleaks-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-tools
          key: gitleaks-${{ runner.os }}-${{ runner.arch }}-gl${{ env.GITLEAKS_VERSION }}-${{ env.GITLEAKS_SHA256 }}

      - name: Install the pinned gitleaks
        if: steps.gitleaks-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p .ci-tools

          verify() { # verify <file> <expected sha256>
            actual="$(shasum -a 256 "$1" | cut -d' ' -f1)"
            if [ "$actual" != "$2" ]; then
              printf '::error::checksum mismatch for %s\n  expected %s\n  actual   %s\n' "$1" "$2" "$actual"
              exit 1
            fi
          }

          curl -fsSL --retry 3 --retry-all-errors -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_darwin_arm64.tar.gz"
          verify /tmp/gitleaks.tar.gz "$GITLEAKS_SHA256"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          mv /tmp/gitleaks .ci-tools/gitleaks
          chmod +x .ci-tools/gitleaks

      - name: Report the gitleaks version
        run: .ci-tools/gitleaks version

      - name: Add the pinned gitleaks to PATH
        run: echo "${{ github.workspace }}/.ci-tools" >> "$GITHUB_PATH"

      # Self-test runs first — a scan that matches nothing is green on any
      # history, so proving it still fails on a deliberate violation is what
      # makes the step below mean something.
      - name: Self-test the secret scan
        run: tools/secret-scan/self-test.sh

      # No --log-opts restriction: every commit ever pushed to `main`.
      - name: secret-scan (full history)
        run: tools/secret-scan/secret-scan.sh detect
