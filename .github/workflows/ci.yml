# The first half of the CI pipeline. The stage list, its order, and the fact
# that every stage is a required check are SPEC decisions, and the reasoning is
# on the wiki rather than repeated here:
#
#   https://github.com/CalixtoTheBugHunter/talos/wiki/Engineering-Standards#ci-pipeline-order
#   https://github.com/CalixtoTheBugHunter/talos/wiki/Engineering-Standards#toolchain
#
# Each job's `name:` is the required status check context, so a rename here
# breaks the ruleset in `docs/github/ruleset-main.json` and must change both.
#
# What this workflow does NOT do, stated because a green run is otherwise read
# as a claim it never made:
#
#   - It now produces all six required contexts. `perf-budget` and `a11y`
#     assert only what a hosted runner can measure — see each job's own
#     header comment for what it explicitly does not claim, and
#     https://github.com/CalixtoTheBugHunter/talos/wiki/Verification for the
#     four gates that stay a documented manual pre-release check.
#   - The no-values rule is checked inside `lint`, per decision 56 — SwiftLint
#     rules for seven of the eight classes, plus `design-guard` for the bundled
#     color asset and the escape hatch, neither of which SwiftLint can see.
#     `design-guard` is a STEP, not a stage, so it adds no seventh required
#     context. Two residues are review-enforced and a green `lint` claims nothing
#     about them: tools/design-guard/README.md § What is NOT covered.
#   - The PR title's Conventional Commits format is also checked inside `lint`,
#     by `pr-title-guard` — a STEP, not a stage, for the same reason
#     `design-guard` and `codeowners-guard` are: it adds no required context of
#     its own. See tools/pr-title-guard/README.md.

name: ci

on:
  pull_request:
  push:
    branches: [main]

# Read-only by default. Any job needing more declares it itself, so a widened
# permission is visible in the diff that widened it.
permissions:
  contents: read

# Cancel superseded runs on a branch, but never on `main` — a push to `main`
# is the run whose result the ruleset records.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # `macos-26` is the arm64 image; `macos-26-intel` is x64. Pinned to an exact
  # Xcode rather than the image default, because "default" moves on the image's
  # own schedule and a runner image change must not silently alter results.
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

  # Pinned by version AND by checksum. A checksum is the half that detects a
  # re-tagged asset, which a version alone does not.
  SWIFTLINT_VERSION: 0.65.0
  SWIFTLINT_SHA256: d6cb0aa7a2f5f1ef306fc9e37bcb54dc9a26facc8f7784ac0c3dd3eccf5c6ba6
  SWIFTFORMAT_VERSION: 0.62.1
  SWIFTFORMAT_SHA256: 7cb1cb1fae04932047c7015441c543848e8e60e1572d808d080e0a1f1661114a

jobs:
  # ── lint ────────────────────────────────────────────────────────────────
  lint:
    name: lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pin the toolchain
        run: |
          xcodebuild -version
          swift --version

      # SwiftFormat 0.62.1 is preinstalled on this image and SwiftLint is not,
      # but both are installed from a pinned archive anyway: a preinstalled
      # version is the image's choice, and `.swiftformat` declares
      # `--min-version 0.62.1` rather than a maximum, so an image bump would
      # otherwise change what `--lint` asserts without any diff here.
      - name: Cache the pinned linters
        id: linters
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-tools
          key: linters-${{ runner.os }}-${{ runner.arch }}-sl${{ env.SWIFTLINT_VERSION }}-${{ env.SWIFTLINT_SHA256 }}-sf${{ env.SWIFTFORMAT_VERSION }}-${{ env.SWIFTFORMAT_SHA256 }}

      - name: Install the pinned linters
        if: steps.linters.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p .ci-tools

          verify() { # verify <file> <expected sha256>
            actual="$(shasum -a 256 "$1" | cut -d' ' -f1)"
            if [ "$actual" != "$2" ]; then
              printf '::error::checksum mismatch for %s\n  expected %s\n  actual   %s\n' "$1" "$2" "$actual"
              exit 1
            fi
          }

          curl -fsSL --retry 3 --retry-all-errors -o /tmp/swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          verify /tmp/swiftlint.zip "$SWIFTLINT_SHA256"
          unzip -qo /tmp/swiftlint.zip -d /tmp/swiftlint
          mv /tmp/swiftlint/swiftlint .ci-tools/swiftlint

          curl -fsSL --retry 3 --retry-all-errors -o /tmp/swiftformat.zip \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip"
          verify /tmp/swiftformat.zip "$SWIFTFORMAT_SHA256"
          unzip -qo /tmp/swiftformat.zip -d /tmp/swiftformat
          mv /tmp/swiftformat/swiftformat .ci-tools/swiftformat

          chmod +x .ci-tools/swiftlint .ci-tools/swiftformat

      - name: Report the linter versions
        run: |
          set -euo pipefail
          .ci-tools/swiftlint version
          .ci-tools/swiftformat --version

      # No `--strict`: warnings-as-errors comes from `strict: true` in
      # `.swiftlint.yml`, so the same answer holds in CI, in the pre-commit
      # hook, and in an editor.
      - name: SwiftLint
        run: |
          set -euo pipefail
          if ! .ci-tools/swiftlint lint; then
            printf '::error::SwiftLint found violations. Warnings are errors by `strict: true` in .swiftlint.yml — see https://github.com/CalixtoTheBugHunter/talos/wiki/Engineering-Standards#toolchain\n'
            printf 'Fix locally with: swiftlint lint --fix\n'
            exit 1
          fi

      - name: SwiftFormat --lint
        run: |
          set -euo pipefail
          if ! .ci-tools/swiftformat --lint .; then
            printf '::error::SwiftFormat found unformatted files — see https://github.com/CalixtoTheBugHunter/talos/wiki/Engineering-Standards#toolchain\n'
            printf 'Fix locally with: swiftformat .\n'
            printf 'The pre-commit hook in .githooks/pre-commit does this automatically; see CONTRIBUTING.md.\n'
            exit 1
          fi

      # The no-values rule, per decision 56. The self-test runs first for the
      # reason `spec-guard`'s does: a rule SwiftLint rejects as invalid "falls
      # back to default" and silently catches nothing, which is green on a clean
      # tree — so proving the rule still fails on a deliberate violation is what
      # makes the step below mean something. It finds `.ci-tools/swiftlint`
      # itself, so it tests the pinned binary this job installed rather than
      # whatever is on PATH.
      - name: Self-test the no-values rule
        run: tools/design-guard/self-test.sh

      - name: design-guard
        run: tools/design-guard/design-guard.sh

      # Asserts .github/CODEOWNERS still parses and still covers the six
      # categories in § Protection rules on `main`. A step inside `lint`, not
      # a stage of its own, per the same precedent as design-guard above:
      # https://github.com/CalixtoTheBugHunter/talos/wiki/Engineering-Standards#ci-pipeline-order
      #
      # The self-test runs first, for the same reason design-guard's does: a
      # guard that matches nothing is green on any input.
      - name: Self-test the CODEOWNERS guard
        run: tools/codeowners-guard/self-test.sh

      # GH_TOKEN authenticates the live `gh api .../codeowners/errors` call —
      # no elevated permission, the default `contents: read` token is enough.
      - name: codeowners-guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/codeowners-guard/codeowners-guard.sh

      # Only the `pull_request` event carries a PR title/body to check — a
      # push to `main` has neither, so this step is a no-op there rather than
      # a failure. Self-test runs first, for the same reason the guards above
      # run theirs first: a guard that matches nothing is green on any title.
      - name: Self-test the PR title guard
        if: github.event_name == 'pull_request'
        run: tools/pr-title-guard/self-test.sh

      - name: pr-title-guard
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: tools/pr-title-guard/pr-title-guard.sh

  # ── build ───────────────────────────────────────────────────────────────
  build:
    name: build
    runs-on: macos-26
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pin the toolchain
        run: |
          xcodebuild -version
          swift --version

      # Only SwiftPM's build directory is cached. Nothing derived from Xcode is:
      # a stale DerivedData is the failure mode a release build exists to catch.
      - name: Cache SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: spm-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            spm-release-${{ runner.os }}-${{ runner.arch }}-

      # Release, not Debug, so an optimization-only failure fails here.
      - name: Build the package (release)
        run: |
          set -euo pipefail
          if ! swift build -c release; then
            printf '::error::`swift build -c release` failed. Release builds catch optimization-only failures a Debug build does not.\n'
            exit 1
          fi

      # `ARCHS`/`ONLY_ACTIVE_ARCH` are required rather than advisory: they are
      # the only mechanism that reaches the synthesized package target, per
      # decision 54 —
      # https://github.com/CalixtoTheBugHunter/talos/wiki/Technology-and-Distribution#xcode-cannot-express-arm64-only-for-a-local-package-target
      - name: Build the app bundle (release, arm64)
        run: |
          set -euo pipefail
          if ! xcodebuild -project Talos.xcodeproj -scheme Talos \
              -configuration Release -derivedDataPath "$RUNNER_TEMP/dd" \
              ARCHS=arm64 ONLY_ACTIVE_ARCH=YES build; then
            printf '::error::Release build of the app bundle failed.\n'
            exit 1
          fi

      # The release gate is `lipo -archs` on the binary inside the bundle. It is
      # asserted rather than assumed, because the overrides above are the only
      # thing keeping it true.
      - name: Assert the bundle is arm64 only
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/dd/Build/Products/Release/Talos.app/Contents/MacOS/Talos"
          archs="$(lipo -archs "$binary")"
          printf 'lipo -archs %s -> %s\n' "$binary" "$archs"
          if [ "$archs" != "arm64" ]; then
            printf '::error::expected `arm64`, measured `%s`. The SPEC decision is Apple Silicon only — https://github.com/CalixtoTheBugHunter/talos/wiki/Technology-and-Distribution#decisions\n' "$archs"
            exit 1
          fi

  # ── test ────────────────────────────────────────────────────────────────
  test:
    name: test
    runs-on: macos-26
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pin the toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: spm-debug-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            spm-debug-${{ runner.os }}-${{ runner.arch }}-

      # The suite installs nothing — no agent CLI, no credential, no network:
      # https://github.com/CalixtoTheBugHunter/talos/wiki/Engineering-Standards#the-suite-installs-nothing
      - name: Swift Testing
        id: swift_test
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/test-results"
          status=0
          swift test --xunit-output "$RUNNER_TEMP/test-results/results.xml" || status=$?
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      # Runs even when the suite fails, so a failing run reports its numbers
      # rather than only its exit code.
      - name: Report the results
        if: always() && steps.swift_test.outcome != 'skipped'
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/test-results/results-swift-testing.xml"
          if [ ! -f "$report" ]; then
            printf '::warning::no JUnit report was written — the suite did not run to completion\n'
            printf 'No test report was produced, so no result is claimed here.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          get() { xmllint --xpath "string(/testsuites/testsuite/@$1)" "$report"; }
          tests="$(get tests)"
          failures="$(get failures)"
          errors="$(get errors)"
          skipped="$(get skipped)"

          # A table, not prose — Foundations: Tone § Structure over prose.
          {
            printf '### Swift Testing\n\n'
            printf '| Tests | Failures | Errors | Skipped |\n'
            printf '| --- | --- | --- | --- |\n'
            printf '| %s | %s | %s | %s |\n\n' "$tests" "$failures" "$errors" "$skipped"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$failures" != "0" ] || [ "$errors" != "0" ]; then
            printf '#### Failed\n\n' >> "$GITHUB_STEP_SUMMARY"
            # Indexed `string()` lookups, not a text-stream split on the raw
            # attribute list: a Swift Testing display name commonly contains a
            # space (`.swiftformat`'s `--test-case-name-format preserve` keeps
            # it that way), and splitting on spaces silently dropped any name
            # that did.
            failed_count="$(xmllint --xpath 'count(//testcase[failure or error])' "$report" 2>/dev/null)"
            i=1
            while [ "$i" -le "$failed_count" ]; do
              xmllint --xpath "string(//testcase[failure or error][$i]/@name)" "$report" 2>/dev/null \
                | sed 's/^/- `/; s/$/`/' >> "$GITHUB_STEP_SUMMARY"
              i=$((i + 1))
            done
            printf '\n' >> "$GITHUB_STEP_SUMMARY"
          fi

          # A skip is reported rather than swallowed: a skipped test is
          # indistinguishable from a passing one on a green run.
          if [ "$skipped" != "0" ]; then
            printf '::warning::%s test(s) were skipped\n' "$skipped"
          fi

      - name: Upload the test report
        if: always() && steps.swift_test.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: swift-testing-results
          path: ${{ runner.temp }}/test-results/
          if-no-files-found: warn

  # ── spec-guard ──────────────────────────────────────────────────────────
  # The automation of MVP Definition of Done item 11, which that page calls
  # "checkable by grep":
  # https://github.com/CalixtoTheBugHunter/talos/wiki/MVP-Definition-of-Done#notes-on-the-harder-criteria
  #
  # `macos-26` rather than a Linux runner, though the check needs no toolchain:
  # the script is run locally on macOS too, and the same grep implementation is
  # what makes CI and a developer's machine give the same answer.
  spec-guard:
    name: spec-guard
    runs-on: macos-26
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The self-test runs first. A guard that matches nothing is green on any
      # codebase, so proving it still fails on a deliberate violation is what
      # makes the step below mean something.
      - name: Self-test the guard
        run: tools/spec-guard/self-test.sh

      - name: spec-guard
        run: tools/spec-guard/spec-guard.sh

  # ── perf-budget ─────────────────────────────────────────────────────────
  # Asserts the one budget in
  # https://github.com/CalixtoTheBugHunter/talos/wiki/Vision-and-Principles#budgets-that-make-the-above-testable
  # that is measurable on a hosted runner with zero dependency on runtime app
  # behavior that does not exist yet (no session, no agent, no Monitor
  # Screen): app bundle size, < 60 MB.
  #
  # What this job does NOT claim, stated because a green run is otherwise
  # read as covering more than it does — per
  # https://github.com/CalixtoTheBugHunter/talos/wiki/Verification, "Nothing
  # on this page duplicates a required check":
  #
  #   - Idle memory, active memory, cold launch, idle CPU/no-polling-timers,
  #     and UI-interaction latency are not measured here. They are
  #     https://github.com/CalixtoTheBugHunter/talos/issues/108, a separate,
  #     Instruments/xctrace-driven mechanism this job does not duplicate.
  #   - Frame rate during Liquid Glass animation is a documented manual
  #     pre-release check per decision 49 — a GitHub-hosted runner is not a
  #     ProMotion display — tracked by
  #     https://github.com/CalixtoTheBugHunter/talos/issues/154.
  #   - Talos-added token overhead is a runtime, per-session metric measured
  #     on the Monitor Screen, not a static build property.
  perf-budget:
    name: perf-budget
    runs-on: macos-26
    needs: spec-guard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pin the toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: spm-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            spm-release-${{ runner.os }}-${{ runner.arch }}-

      # Same build this budget is measured against at release time — release
      # config, arm64 only, per decision 54.
      - name: Build the app bundle (release, arm64)
        run: |
          set -euo pipefail
          xcodebuild -project Talos.xcodeproj -scheme Talos \
            -configuration Release -derivedDataPath "$RUNNER_TEMP/dd" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES build

      # A single prior measurement, carried forward via cache rather than
      # committed to the repo — restore-keys falls back to the most recent
      # run's save under this prefix, following the same restore-keys idiom
      # already used above for SwiftPM. This is deliberately one data point,
      # not unbounded history: enough to show whether THIS change made it
      # worse, without a bot committing to `main` to keep a growing log.
      - name: Restore the previous measured bundle size
        id: restore-history
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-perf-history/bundle-size-mb.txt
          key: perf-budget-bundle-size-${{ github.run_id }}
          restore-keys: |
            perf-budget-bundle-size-

      - name: Measure the app bundle size
        id: measure
        run: |
          set -euo pipefail
          budget_mb=60
          app="$RUNNER_TEMP/dd/Build/Products/Release/Talos.app"
          measured_mb="$(du -sm "$app" | cut -f1)"

          previous_mb='n/a'
          if [ -f .ci-perf-history/bundle-size-mb.txt ]; then
            previous_mb="$(cat .ci-perf-history/bundle-size-mb.txt)"
          fi

          {
            printf '### perf-budget\n\n'
            printf '| Budget | Measured | Previous run | SPEC budget |\n'
            printf '| --- | --- | --- | --- |\n'
            printf '| App bundle size | %s MB | %s MB | < %s MB |\n\n' "$measured_mb" "$previous_mb" "$budget_mb"
            printf 'Does **not** measure idle/active memory, cold launch, idle CPU, or UI-latency — see https://github.com/CalixtoTheBugHunter/talos/issues/108.\n'
          } >>"$GITHUB_STEP_SUMMARY"

          mkdir -p .ci-perf-history
          printf '%s' "$measured_mb" >.ci-perf-history/bundle-size-mb.txt

          if [ "$measured_mb" -ge "$budget_mb" ]; then
            printf '::error::perf-budget: app bundle size %s MB breaches the SPEC budget of < %s MB.\n' "$measured_mb" "$budget_mb"
            printf '  spec: https://github.com/CalixtoTheBugHunter/talos/wiki/Vision-and-Principles#budgets-that-make-the-above-testable\n'
            exit 1
          fi

      - name: Save this run's measured bundle size
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-perf-history/bundle-size-mb.txt
          key: perf-budget-bundle-size-${{ github.run_id }}

  # ── a11y ────────────────────────────────────────────────────────────────
  # A required XCUITest stage per
  # https://github.com/CalixtoTheBugHunter/talos/wiki/Engineering-Standards#ci-pipeline-order.
  # Runs Apple's built-in `performAccessibilityAudit()` against the current
  # surface — the structural half of the gate Verification carves out for
  # CI: "`a11y` asserts labels, hints, and roles."
  #
  # What this job does NOT claim, stated for the same reason perf-budget's
  # header does:
  #
  #   - VoiceOver *comprehensibility* — whether the spoken result makes
  #     sense — is a judgement, not an assertion; it stays a documented
  #     manual pre-release check per
  #     https://github.com/CalixtoTheBugHunter/talos/wiki/Verification.
  #   - Streaming-output announcements, the approval prompt's announce-before
  #     -acting behavior, dark/light mode, text size at 100%/200%, Reduce
  #     Motion, and Reduce Transparency are not exercised here. Full,
  #     surface-by-surface coverage as those surfaces are built is
  #     https://github.com/CalixtoTheBugHunter/talos/issues/97.
  #   - `TalosUITests.swift` only fails the audit on Talos's own
  #     accessibility-relevant element types (currently just `.staticText`).
  #     `performAccessibilityAudit(.all)` also walks AppKit's own window
  #     chrome — an anonymous root content Group, a TouchBar — which no
  #     placement of a SwiftUI accessibility modifier can label, because
  #     Talos's view code does not create those elements. See that file's
  #     comment for what was tried.
  a11y:
    name: a11y
    runs-on: macos-26
    needs: perf-budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pin the toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: spm-debug-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            spm-debug-${{ runner.os }}-${{ runner.arch }}-

      - name: Build for testing
        run: |
          set -euo pipefail
          xcodebuild build-for-testing -project Talos.xcodeproj -scheme Talos \
            -configuration Debug -only-testing:TalosUITests \
            -derivedDataPath "$RUNNER_TEMP/dd"

      - name: Restore the previous audit issue count
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-a11y-history/issue-count.txt
          key: a11y-issue-count-${{ github.run_id }}
          restore-keys: |
            a11y-issue-count-

      - name: Run the accessibility audit
        id: audit
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/test-results"

          # `|| true` neutralizes `set -e` for this one pipeline so the
          # script reaches the PIPESTATUS read below on a test failure —
          # xcodebuild's own exit code, not tee's, is what `status` must
          # carry. `TalosUITests.swift` never throws early (every audit
          # issue is accepted so it can keep enumerating), and instead
          # prints `ACCESSIBILITY_ISSUE_COUNT: N` unconditionally — a real
          # count, not a bare pass/fail bit, is what gets read below.
          xcodebuild test-without-building -project Talos.xcodeproj -scheme Talos \
            -configuration Debug -only-testing:TalosUITests \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -resultBundlePath "$RUNNER_TEMP/test-results/a11y.xcresult" \
            2>&1 | tee "$RUNNER_TEMP/test-results/a11y.log" || true
          status=${PIPESTATUS[0]}

          issues="$(grep -oE 'ACCESSIBILITY_ISSUE_COUNT: [0-9]+' "$RUNNER_TEMP/test-results/a11y.log" | tail -1 | awk '{print $2}')"
          if [ -z "$issues" ]; then
            issues='unknown'
          fi

          previous='n/a'
          if [ -f .ci-a11y-history/issue-count.txt ]; then
            previous="$(cat .ci-a11y-history/issue-count.txt)"
          fi

          {
            printf '### a11y\n\n'
            printf '| Check | This run | Previous run |\n'
            printf '| --- | --- | --- |\n'
            printf '| Accessibility audit issues (on Talos'"'"'s own elements) | %s | %s |\n\n' "$issues" "$previous"
            printf 'Structural audit only — labels, traits, contrast, hit-target size. Comprehensibility, streaming announcements, and full surface coverage are tracked separately; see this job'"'"'s header comment.\n'
          } >>"$GITHUB_STEP_SUMMARY"

          mkdir -p .ci-a11y-history
          printf '%s' "$issues" >.ci-a11y-history/issue-count.txt

          exit "$status"

      - name: Save this run's audit issue count
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-a11y-history/issue-count.txt
          key: a11y-issue-count-${{ github.run_id }}

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: a11y-results
          path: ${{ runner.temp }}/test-results/
          if-no-files-found: warn
